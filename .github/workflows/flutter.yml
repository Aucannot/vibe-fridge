name: Flutter CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"
  push:
    branches:
      - main
      - "docs/**"
    paths:
      - "mobile/**"
      - ".github/workflows/flutter.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
